name: Faceless Engine Cron
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  engine-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run engine cycle
        run: python orchestrator.py --mode one-shot